[project]
name = "python-style"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3", "packaging>=24", "pyyaml>=6"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib/python_style"]

[dependency-groups]
dev = ["poethepoet>=0.32", "pre-commit>=4", "pytest>=8", "ruff>=0.11", "ty>=0.0.1", "types-pyyaml>=6"]

[tool.poe.tasks]
format = "ruff format ."
"check:lint" = "ruff check ."
"check:format" = "ruff format --check ."
"check:types" = "ty check"
check = ["check:lint", "check:format", "check:types"]
"fix:lint" = "ruff check --fix ."
fix = ["fix:lint", "format"]
test = "pytest"

[tool.ruff]
target-version = "py312"
extend-include = ["bin/python-style"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ANN", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
python-style = "python_style.cli:main"
